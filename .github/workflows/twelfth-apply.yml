name: Apply remaining twelfth audit fixes

on:
  push:
    branches: [twelfth-audit-clarity-full-coverage]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: twelfth-audit-clarity-full-coverage
      - name: Apply precise replacements
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f'missing target in {path}: {old[:80]}')
              p.write_text(text.replace(old,new))

          replace('js/scenes/evaluation.js','طبّق تعديل السياسة ثم أعد الاختبار','طبّق تعديل السياسة وانتقل إلى إعادة الاختبار')
          replace('js/scenes/evaluation.js','راجع الحق ونقح البيانات ثم أعد التدريب','راجع الحق ونقح البيانات ثم جهّز نسخة جديدة')
          replace('js/scenes/evaluation.js','استبعد المادة وأعد التدريب','استبعد المادة ثم جهّز نسخة جديدة')
          replace('js/scenes/evaluation.js','النسخة السابقة استخدمت الشكل القديم ولذلك يجب إعادة التدريب.','النسخة السابقة استخدمت الشكل القديم؛ لذلك أصبحت أدلتها تاريخية، وستحدث إعادة التدريب عند بدء النسخة التالية.')
          replace('js/scenes/evaluation.js','أزيلت المادة من النسخة التالية.','أزيلت المادة من مدخلات النسخة التالية؛ إعادة التدريب ستحدث عند بدء الجولة الجديدة.')
          replace('js/scenes/deployment.js','<strong>اقبل فجوة المرونة وتابع</strong><small>تُسجل كقيد معروف قبل فتح حركة المستخدمين.</small>',"<strong>${atMaximum?'سجّل القيد البنيوي وتابع':'اقبل فجوة المرونة الحالية وتابع'}</strong><small>${atMaximum?'بلغت أفضل مرونة تسمح بها سعات السيناريو؛ يسجل القيد بدل نسبته إلى اختيار توزيع ضعيف.':'يمكنك تحسين التوزيع أو قبول النتيجة الحالية كفجوة معروفة.'}</small>")
          replace('js/scenes/deployment.js',"const resilient=survivableFailures(values);state.flags.deployResilienceAccepted=resilient<3;addDecision(`deploy-resilience-${values.join('-')}`,'اختبرت المرونة وسجلت الفجوة قبل فتح الخدمة',`التوزيع ${values.join(' / ')} يتحمل ${resilient}/3 حالات كاملة.`);", "const resilient=survivableFailures(values),atMaximum=resilient>=MAX_SURVIVABLE_FAILURES;state.flags.deployResilienceAccepted=resilient<3;addDecision(`deploy-resilience-${values.join('-')}`,atMaximum?'اختبرت المرونة وسجلت القيد البنيوي قبل فتح الخدمة':'اختبرت المرونة وقبلت الفجوة الحالية قبل فتح الخدمة',`التوزيع ${values.join(' / ')} يتحمل ${resilient}/3 حالات كاملة.`);")
          replace('docs/GAME-DESIGN.md','يمكن أن تنتهي الحصة مع عمل صيانة مفتوح؛ اكتمال الحصة لا يعني أن الخطر اختفى.','يمكن أن تنتهي الحصة مع عمل صيانة مفتوح؛ اكتمال الحصة لا يعني أن الخطر اختفى. وإذا أُغلق القطاع، فالإغلاق لا يعالج الخطر تلقائيًا: يظهر الفحص ثم التشخيص ثم الإصلاح ثم إعادة اختبار الاهتزاز قبل اعتبار الخطر مغلقًا.')
          replace('docs/METHODOLOGY.md','إذا انتهت الحصة مع فحص مؤجل يمكن أن تكون المهمة المباشرة مكتملة بينما يبقى عمل صيانة مفتوحًا.','إذا انتهت الحصة مع فحص مؤجل يمكن أن تكون المهمة المباشرة مكتملة بينما يبقى عمل صيانة مفتوحًا. وعند اختيار الإغلاق لا تحتسب اللعبة الفحص أو الإصلاح تلقائيًا؛ يجب تنفيذ الفحص وتشخيص السبب وإصلاحه ثم إعادة اختبار الاهتزاز قبل إغلاق الخطر.')
          replace('docs/NARRATIVE.md','إيقاف خط المصنع لا يشخّص التنبيه ولا يصلحه، وإيقاف الاختبار لا يصلح التبريد، والتوقف في التدريب لا يعيد الحوسبة، وتشخيص الذاكرة لا يخفض القياس، وإجراء الاستعادة لا يثبت عودة الخدمة.','إغلاق قطاع التعدين لا يشخّص الاهتزاز ولا يصلحه، وإيقاف خط المصنع لا يشخّص التنبيه ولا يصلحه، وإيقاف الاختبار لا يصلح التبريد، والتوقف في التدريب لا يعيد الحوسبة، وتشخيص الذاكرة لا يخفض القياس، وإجراء الاستعادة لا يثبت عودة الخدمة.')
          replace('docs/ARCHITECTURE.md','- `task-flow.js` — الحالات الحالية: active / decision / debt / complete فقط.','- `task-flow.js` — الحالات الحالية: active / decision / action / debt / complete؛ «قرار مطلوب» للمفاضلات الحقيقية و«تنفيذ مطلوب» للإصلاح أو القياس أو التحقق.')
          replace('README.md','- **الإصلاح منفصل عن التحقق.** هذا مطبق في صيانة المصنع، تبريد مركز البيانات، استعادة التدريب، ومعالجة سعة الإصدار.','- **الإصلاح منفصل عن التحقق.** هذا مطبق في فحص قطاع التعدين، صيانة المصنع، تبريد مركز البيانات، استعادة التدريب، ومعالجة سعة الإصدار.')
          history=Path('docs/AUDIT-HISTORY.md'); text=history.read_text()
          if '## الجولة الثانية عشرة' not in text:
              history.write_text(text.rstrip()+'''\n\n## الجولة الثانية عشرة — وضوح نوع العمل والتغطية الشاملة\n\n- فصل إغلاق قطاع التعدين عن الفحص والتشخيص والإصلاح وإعادة التحقق.\n- إضافة حالة `action` كي لا تستخدم شارة «قرار مطلوب» في خطوات التنفيذ أو القياس.\n- إضافة إرشاد مخصص للخاتمة وتحدي انتقال التعلم.\n- تصحيح نصوص الحوكمة والسلامة حتى لا تدعي تنفيذ إعادة التدريب أو إعادة الاختبار قبل حدوثهما.\n- التفريق بين فجوة مرونة ناتجة عن توزيع قابل للتحسين وبين القيد البنيوي عند بلوغ أفضل نتيجة ممكنة.\n- إضافة رحلة متصفح كاملة من البداية إلى النتائج على سطح المكتب والهاتف، مع فحوص وصول دورية وتشغيل الرحلة على Firefox وWebKit.\n- لم تظهر صفحة تشغيل قديمة جديدة للحذف؛ `index.html` تبقى صفحة التشغيل الوحيدة، وتظل migrations v2-v6 توافقًا مقصودًا وليست runtime قديمًا.\n''')
      - name: Commit replacements
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/scenes/evaluation.js js/scenes/deployment.js docs README.md
          git commit -m 'الجولة الثانية عشرة: تصحيح النصوص السببية والتوثيق'
          git push origin HEAD:twelfth-audit-clarity-full-coverage
