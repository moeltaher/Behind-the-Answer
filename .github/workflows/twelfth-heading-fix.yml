name: Apply twelfth heading fix

on:
  push:
    branches: [twelfth-audit-clarity-full-coverage]

permissions:
  contents: write

# One-shot helper; delete after the generated source commit.
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: twelfth-audit-clarity-full-coverage
      - name: Fix ending heading hierarchy
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/scenes/ending.js')
          text=p.read_text()
          replacements={
            '<h3>مسار مادي طويل الأجل</h3>':'<h2>مسار مادي طويل الأجل</h2>',
            '<h3>دورة تطوير متكررة</h3>':'<h2>دورة تطوير متكررة</h2>',
            '<h3>تشغيل مستمر</h3>':'<h2>تشغيل مستمر</h2>'
          }
          for old,new in replacements.items():
              if old not in text: raise SystemExit(f'missing target: {old}')
              text=text.replace(old,new,1)
          p.write_text(text)
          q=Path('tests/full-journey.mjs')
          test=q.read_text().replace("if(checkAxe)await axe(page,`${label}:deployment`);","if(checkAxe)await axe(page,`${label}:ending-assembly`);")
          q.write_text(test)
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/scenes/ending.js tests/full-journey.mjs
          git commit -m 'إصلاح ترتيب عناوين تركيب الخاتمة'
          git push origin HEAD:twelfth-audit-clarity-full-coverage
