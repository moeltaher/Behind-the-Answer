name: Validate static game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Audit development dependencies
        run: npm run audit:ci

      - name: Validate JavaScript syntax
        run: npm run check:syntax

      - name: Detect unused local JavaScript
        run: npm run check:lint

      - name: Validate static architecture and references
        run: npm run check:static

      - name: Validate versioned storage schema and invariants
        run: npm run check:storage

      - name: Detect unused CSS selectors and definitions
        run: npm run check:css

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/behind-answer-server.log 2>&1 &
          echo $! > /tmp/behind-answer-server.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/behind-answer-server.log
          exit 1

      - name: Run complete browser, causality, migration, accessibility and cross-browser suite
        run: npm run test:browser

      - name: Run third-audit regression suite
        run: npm run test:third-audit

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/behind-answer-server.pid ]; then
            kill "$(cat /tmp/behind-answer-server.pid)" || true
          fi
