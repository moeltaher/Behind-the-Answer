name: Validate static game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Detect unused local JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eslint@10.8.1 js tests \
            --no-config-lookup \
            --rule 'no-unused-vars: ["error", {"args":"after-used","caughtErrors":"none"}]'

      - name: Validate static architecture and references
        run: node tests/static-integrity.mjs

      - name: Detect unused CSS selectors
        run: node tests/css-integrity.mjs

      - name: Install browser smoke-test dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run complete journey on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/behind-answer-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.5
          done
          node tests/smoke.mjs
