name: Apply fourteenth audit fixes on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fourteenth-audit-causality-accessibility-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fourteenth-audit-causality-accessibility-cleanup
          fetch-depth: 0

      - name: Execute audited patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/apply-fourteenth-audit.yml').read_text()
          marker="python3 - <<'PY'\n"
          body=workflow.split(marker,1)[1].split("\n          PY",1)[0]
          exec(textwrap.dedent(body),{'__name__':'__main__'})
          PY
          rm -f .github/workflows/apply-fourteenth-audit-pr.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run fast validation
        run: |
          npm run check:syntax
          npm run check:lint
          npm run check:static
          npm run check:storage
          npm run check:css

      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "الجولة الرابعة عشرة: السببية والوصول والتنظيف"
          git push origin HEAD:fourteenth-audit-causality-accessibility-cleanup
